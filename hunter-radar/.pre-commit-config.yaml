# Hunter Radar V1.6.1 — Pre-commit hooks
# 安装: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '(uv\.lock|package-lock\.json)'

  - repo: local
    hooks:
      - id: freeze-check
        name: OpenAPI freeze check
        entry: python scripts/compliance_check.py
        language: system
        pass_filenames: false
        always_run: true

      - id: forbidden-words
        name: Forbidden recommendation words
        entry: python -c "import sys; from pathlib import Path; words=['建议买入','建议卖出','建仓时机','清仓','必涨','必跌','100%','保证收益','无风险']; hits=[(f,i+1,l.strip()) for f in sys.argv[1:] for i,l in enumerate(Path(f).read_text(encoding='utf-8',errors='ignore').splitlines()) if any(w in l for w in words) and not l.strip().startswith('#')]; [print(f'{h[0]}:{h[1]}: {h[2]}') for h in hits]; sys.exit(1 if hits else 0)"
        language: system
        files: '.*\.py$'
        exclude: '(scripts/|tests/|\.pre-commit)'
